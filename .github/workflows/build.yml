name: Build Fedora

# This repository holds the Fedora build only. The workflow it inherited from
# the pre-split tree ran nine jobs covering every platform, eight of which had
# no source left to compile and failed on every push.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            patchelf rpm file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck the frontend
        run: npm run typecheck

      - name: Build the frontend
        run: npx vite build

      - name: Lint the Rust backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Test the Rust backend
        working-directory: src-tauri
        run: cargo test --lib

  build:
    name: Fedora (rpm)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            patchelf rpm file

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the bundle
        run: npm run tauri -- build --bundles rpm

      - uses: actions/upload-artifact@v4
        with:
          name: aria-rpm
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm

      - name: Publish the Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/rpm/*.rpm
